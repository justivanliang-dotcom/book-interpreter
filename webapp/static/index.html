<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书籍解读器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="page">
  <section class="main-card">

    <header class="app-head">
      <h1>书籍解读器</h1>
      <p class="tagline">输入一本书，获得结构化解读与自由问答</p>
    </header>

    <div class="upload-bar">
      <input type="file" id="file-input" accept=".txt,.md,.pdf,.epub,.mobi,.azw3" hidden>
      <button class="btn primary" id="upload-btn">上传书籍</button>
      <button class="btn accent" id="interpret-btn" disabled>生成全书概述</button>
    </div>
    <p class="formats">支持 TXT / Markdown / PDF / EPUB / MOBI / AZW3，可直接拖入文件</p>
    <p class="status" id="upload-status"></p>

    <div class="saved-books" id="saved-books" hidden>
      <h3>已上传书籍</h3>
      <ul class="book-list" id="book-list"></ul>
    </div>

    <div class="drop-zone" id="empty-state">
      <p class="dz-title">将书籍拖到此处</p>
      <p class="dz-sub">或点击选择文件</p>
    </div>

    <div class="book-card" id="book-card" hidden>
      <h2 id="book-title"></h2>
      <p class="meta" id="book-filename"></p>
      <h3>章节</h3>
      <ul id="chapter-list"></ul>
    </div>

    <hr class="divider">

    <div class="report" id="report" hidden>
      <div class="report-head">
        <h2>解读报告</h2>
        <div class="export-btns">
          <button class="btn ghost" id="export-md">导出 Markdown</button>
          <button class="btn ghost" id="export-html">导出 HTML</button>
        </div>
      </div>
      <h3>全书概述</h3>
      <p id="overview"></p>
      <h3>核心观点</h3>
      <ol id="key-points"></ol>
      <h3>金句摘录</h3>
      <ul id="quotes"></ul>
    </div>

    <div class="qa" id="qa-card" hidden>
      <h2>内容问答</h2>
      <div class="qa-input">
        <input type="text" id="question-input" placeholder="输入关于这本书的问题，例如：这本书的核心观点是什么？">
        <button class="btn primary" id="ask-btn">提问</button>
      </div>
      <div class="answer" id="answer"></div>
    </div>

  </section>
</main>

<div class="source-panel" id="source-panel" hidden>
  <div class="source-panel-head">
    <span>原文出处</span>
    <button class="btn ghost small" id="source-close">关闭</button>
  </div>
  <div class="source-panel-body" id="source-body"></div>
</div>

<script src="/static/tts.js?v=5"></script>
<script src="/static/app.js?v=5"></script>
</body>
</html>
