<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书籍解读器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1>书籍解读器</h1>
    <p class="tagline">输入一本书，获得结构化解读与自由问答</p>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="card upload-card">
      <input type="file" id="file-input" accept=".txt,.md" hidden>
      <button class="btn primary" id="upload-btn">上传书籍</button>
      <p class="hint">支持 TXT / Markdown</p>
      <p class="status" id="upload-status"></p>
    </div>

    <div class="card book-card" id="book-card" hidden>
      <h2 id="book-title"></h2>
      <p class="meta" id="book-filename"></p>
      <button class="btn accent" id="interpret-btn">开始解读</button>
      <h3>章节</h3>
      <ul id="chapter-list"></ul>
    </div>
  </aside>

  <section class="content">
    <div class="card empty" id="empty-state">
      <p>上传一本 TXT/Markdown 书籍，开始生成解读报告</p>
    </div>

    <div class="card report" id="report" hidden>
      <div class="report-head">
        <h2>解读报告</h2>
        <div class="export-btns">
          <button class="btn ghost" id="export-md">导出 Markdown</button>
          <button class="btn ghost" id="export-html">导出 HTML</button>
        </div>
      </div>
      <h3>全书概述</h3>
      <p id="overview"></p>
      <h3>章节摘要</h3>
      <div id="chapter-summaries"></div>
      <h3>核心观点</h3>
      <ol id="key-points"></ol>
      <h3>金句摘录</h3>
      <ul id="quotes"></ul>
    </div>

    <div class="card qa" id="qa-card" hidden>
      <h2>内容问答</h2>
      <div class="qa-input">
        <input type="text" id="question-input" placeholder="输入关于这本书的问题，例如：这本书的核心观点是什么？">
        <button class="btn primary" id="ask-btn">提问</button>
      </div>
      <div class="answer" id="answer"></div>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
